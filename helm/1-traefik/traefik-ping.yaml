---
# traefik native ping ingress for external hc
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-ping
  namespace: kube-system
spec:
  entryPoints:
    - web # Binds to port 80 only
  routes:
    - match: PathPrefix(`/ping`)
      kind: Rule
      services:
        - name: ping@internal
          kind: TraefikService
