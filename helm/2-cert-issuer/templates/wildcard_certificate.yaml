{{- range $domain := .Values.cloudflare.domain_names }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $domain | replace "." "-" }}-wildcard
spec:
  secretName: {{ $domain | replace "." "-" }}-wildcard-tls
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
    group: cert-manager.io
  dnsNames:
    - "*.{{ $domain }}"
    - {{ $domain }}
---
{{- end }}
