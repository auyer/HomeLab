apiVersion: traefik.io/v1alpha1
kind: TLSStore
metadata:
  name: default
spec:
  {{- if .Values.cloudflare.domain_names }}
  certificates:
    {{- range $domain := .Values.cloudflare.domain_names }}
    - secretName: {{ $domain | replace "." "-" }}-wildcard-tls
    {{- end }}
  defaultCertificate:
    secretName: {{ (index .Values.cloudflare.domain_names 0) | replace "." "-" }}-wildcard-tls
  {{- end }}
