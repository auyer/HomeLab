  # Settings for kubewarden-controller.
  # nameOverride Replaces the release name of the chart in Chart.yaml file when
  # this is used to construct Kubernetes object names
  # nameOverride: ""
  # # fullnameOverride completely replaces the generated release name
  # fullnameOverride: ""
  # # Secrets to pull container images from private registries
  # imagePullSecrets: []
  # # -- Additional labels to add to all resources
  # additionalLabels: {}
  # #   app: kubewarden-controller
  # # -- Additional annotations to add to all resources
  # additionalAnnotations: {}
  # #   owner: IT-group1
  # # SecurityContext to be used in the controller and audit-scanner containers. The
  # # content of the containerSecurityContext will be set directly as the
  # # securityContext of the container
  # containerSecurityContext:
  #   allowPrivilegeEscalation: false
  #   capabilities:
  #     drop:
  #       - ALL
  # SecurityContext to be used in the controller and audit-scanner pods. The
  # content of the podSecurityContext will be set directly as the securityContext
  # of the pod
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  # SecurityContext to be used in the pre-delete-hook job container and pod.
  # The content of the next fields will be set directly as the securityContext
  # of the container and pod used in the pre-delete-hook job.
  preDeleteHook:
    containerSecurityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
    podSecurityContext:
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
  # If true, the controller will always accept admission reviews in the
  # deployment namespace. It is recommended to keep this value true unless you
  # have a specific reason to disable it. This is a safety flag to avoid policy
  # evaluations that could interfere with the Kubewarden stack running in the
  # admission controller namespace.
  alwaysAcceptAdmissionReviewsOnDeploymentsNamespace: true
  # affinity configures affinity rules for the controller pod.
  # This takes precedence over global.affinity when set.
  # When hostNetwork is enabled, users should set appropriate podAntiAffinity
  # rules here to prevent host-port conflicts between controller replicas.
  # affinity:
  #   podAntiAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #     - labelSelector:
  #         matchLabels:
  #           app.kubernetes.io/name: kubewarden-controller
  #       topologyKey: kubernetes.io/hostname
  affinity: {}
  # hostNetwork enables host network mode for the controller pod and all
  # PolicyServer pods managed by this controller.
  # WARNING: enabling this increases the attack surface by exposing webhook
  # endpoints on the host network and giving pods visibility of all node network
  # interfaces. Use only when the Kubernetes API server cannot reach pod-network
  # webhook endpoints (e.g. clusters using a non-VPC CNI with NAT).
  # WARNING: When hostNetwork is enabled, users are responsible for setting
  # appropriate podAntiAffinity rules to prevent host-port conflicts between
  # controller replicas on the same node.
  # NOTE: hostNetwork mode is incompatible with telemetry sidecar mode
  # (telemetry.mode=sidecar). This combination is rejected; 
  hostNetwork: false

  # image:
  #   # The registry is defined in the global.cattle.systemDefaultRegistry value
  #   # controller image to be used
  #   repository: "kubewarden/adm-controller/controller"
  #   # image tag
  #   tag: v1.36.0
  #   pullPolicy: IfNotPresent
  # preDeleteJob:
  #   image:
  #     # The registry is defined in the global.cattle.systemDefaultRegistry value
  #     # kuberlr-kubectl image to be used in the pre-delete helm hook.
  #     repository: "rancher/kuberlr-kubectl"
  #     tag: v8.0.0
  # kubewarden-controller deployment settings:
  podAnnotations:
    owner: rcpassos
  nodeSelector: {}
  # additionalEnvironmentVariables is a list of additional environment variables
  # to inject into the controller container.
  # Each entry is a standard Kubernetes EnvVar object (name, value, valueFrom, …).
  # Example:
  #   additionalEnvironmentVariables:
  #     - name: MY_VAR
  #       value: "my-value"
  additionalEnvironmentVariables: []
  # Resource limits & requests
  # Ref: https://kubernetes.io/docs/user-guide/compute-resources/
  resources:
    controller:
      limits:
        # cpu: 500m
        memory: 200Mi
      requests:
        cpu: 250m
        memory: 70Mi
    auditScanner:
      limits:
        # cpu: 500m
        memory: 1Gi
      requests:
        cpu: 250m
        memory: 300Mi
    preDeleteJob:
      limits:
        # cpu: 100m
        memory: 128Mi
      requests:
        # cpu: 50m
        memory: 64Mi
    postInstallJob:
      limits:
        # cpu: 100m
        memory: 128Mi
      requests:
        # cpu: 50m
        memory: 64Mi


