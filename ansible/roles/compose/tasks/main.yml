---
- name: Validate compose engine choice
  ansible.builtin.fail:
    msg: "compose_engine must be 'docker' or 'podman', got '{{ compose_engine }}'"
  when: compose_engine not in ['docker', 'podman']

- name: Resolve real path of compose project source
  delegate_to: localhost
  run_once: true
  become: false
  ansible.builtin.command: realpath "{{ compose_project_src }}"
  register: _compose_src_raw
  changed_when: false

- name: Share resolved source path with all hosts
  ansible.builtin.set_fact:
    _compose_src_real: "{{ hostvars[ansible_play_hosts[0]]['_compose_src_raw'] }}"

- name: Install Docker packages
  when: compose_engine == 'docker'
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose
    state: present
    update_cache: true

- name: Install Podman packages
  when: compose_engine == 'podman'
  ansible.builtin.apt:
    name:
      - podman
      - podman-compose
    state: present
    update_cache: true

- name: Ensure Docker service is running
  when: compose_engine == 'docker'
  ansible.builtin.systemd:
    name: docker
    state: started
    enabled: true

- name: Ensure destination directory exists
  ansible.builtin.file:
    path: "{{ compose_project_dest }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create additional folders for bind mounts
  when: additional_folders | length > 0
  ansible.builtin.file:
    path: "{{ item | split(':') | first }}"
    state: directory
    owner: "{{ (additional_folders_owner | split(':') | first) if additional_folders_owner is defined else omit }}"
    group: "{{ (additional_folders_owner | split(':') | last) if additional_folders_owner is defined else omit }}"
    mode: "{{ (':' in item) | ternary(item | split(':') | last, '0755') }}"
    recurse: yes
  loop: "{{ additional_folders }}"

- name: Discover Jinja2 template files in project source
  delegate_to: localhost
  run_once: true
  become: false
  ansible.builtin.find:
    paths: "{{ _compose_src_real.stdout }}"
    patterns: "*.j2"
    recurse: true
    file_type: file
    excludes: ".git"
  register: _compose_templates

- name: Copy compose project files to target
  ansible.builtin.copy:
    src: "{{ _compose_src_real.stdout }}/"
    dest: "{{ compose_project_dest }}"
    owner: root
    group: root
    mode: preserve

# Clean up raw .j2 files — they will be replaced by their rendered counterparts
- name: Remove raw .j2 template files from target
  ansible.builtin.file:
    path: "{{ compose_project_dest }}/{{ item.path | replace(_compose_src_real.stdout + '/', '') }}"
    state: absent
  loop: "{{ _compose_templates.files }}"
  when: _compose_templates.files | length > 0
  changed_when: false

- name: Render Jinja2 templates to destination
  when: _compose_templates.files | length > 0
  ansible.builtin.template:
    src: "{{ item.path }}"
    dest: "{{ compose_project_dest }}/{{ item.path | replace(_compose_src_real.stdout + '/', '') | regex_replace('\\.j2$', '') }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _compose_templates.files }}"
  notify: Restart compose project

- name: Deploy systemd compose service unit
  ansible.builtin.template:
    src: compose.service.j2
    dest: /etc/systemd/system/compose-{{ compose_project_name }}.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd compose unit
    - Restart compose project

- name: Enable and start compose systemd service
  ansible.builtin.systemd:
    name: compose-{{ compose_project_name }}
    state: started
    enabled: true
    daemon_reload: true
