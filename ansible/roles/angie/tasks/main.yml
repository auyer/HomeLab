---
# Angie role tasks — install, configure

- name: Ensure Angie prerequisites are installed
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
    state: present
    update_cache: true

- name: Add Angie signing key
  ansible.builtin.get_url:
    url: https://angie.software/keys/angie-signing.gpg
    dest: /etc/apt/trusted.gpg.d/angie-signing.gpg
    mode: "0644"

- name: Add Angie repository
  ansible.builtin.shell: |
    echo "deb https://download.angie.software/angie/$(. /etc/os-release && echo "$ID/$VERSION_ID $VERSION_CODENAME") main" \
      > /etc/apt/sources.list.d/angie.list
  args:
    creates: /etc/apt/sources.list.d/angie.list

- name: Ensure Angie is installed
  ansible.builtin.apt:
    name: angie
    state: present
    update_cache: true

- name: Install fcgiwrap for ACME hook support
  ansible.builtin.apt:
    name: fcgiwrap
    state: present
  when: acme_enabled | default(true)

- name: Allow angie user to access fcgiwrap socket
  ansible.builtin.user:
    name: angie
    groups: www-data
    append: yes
  notify:
    - Test Angie configuration
    - Restart Angie
  when: acme_enabled | default(true)

- name: Ensure fcgiwrap socket is active
  ansible.builtin.systemd:
    name: fcgiwrap.socket
    state: started
    enabled: yes
  when: acme_enabled | default(true)

- name: Ensure ACME client path directory exists
  ansible.builtin.file:
    path: "{{ acme_client_path | default('/var/lib/angie/acme') }}"
    state: directory
    owner: angie
    group: angie
    mode: "0755"
  when: acme_enabled | default(true)

- name: Deploy Cloudflare credentials for ACME DNS challenge
  ansible.builtin.template:
    src: cloudflare.ini
    dest: /etc/angie/cloudflare.ini
    owner: angie
    group: www-data
    mode: "0640"
  notify:
    - Test Angie configuration
    - Reload Angie
  when: acme_enabled | default(true)

- name: Deploy ACME Cloudflare hook script
  ansible.builtin.copy:
    src: cloudflare-hook.py
    dest: /usr/local/bin/angie-acme-cloudflare
    owner: root
    group: root
    mode: "0755"
  notify:
    - Test Angie configuration
    - Reload Angie
  when: acme_enabled | default(true)

- name: Ensure ACME hook log file exists and is writable
  ansible.builtin.file:
    path: /var/log/angie/acme-hook.log
    state: touch
    owner: www-data
    group: www-data
    mode: "0644"
  when: acme_enabled | default(true)

- name: Ensure Angie log directory exists
  ansible.builtin.file:
    path: /var/log/angie
    state: directory
    owner: angie
    group: angie
    mode: "0755"

- name: Ensure Angie configuration directory exists
  ansible.builtin.file:
    path: /etc/angie
    state: directory
    owner: angie
    group: angie
    mode: "0755"

- name: Deploy main Angie configuration
  ansible.builtin.template:
    src: angie.conf
    dest: /etc/angie/angie.conf
    owner: angie
    group: angie
    mode: "0644"
  notify:
    - Test Angie configuration
    - Reload Angie

- name: Deploy static Angie conf.d configurations
  ansible.builtin.copy:
    src: conf.d/
    dest: /etc/angie/conf.d/
    owner: angie
    group: angie
    mode: "0644"
    directory_mode: "0755"
  notify:
    - Test Angie configuration
    - Reload Angie

- name: Deploy templated Angie conf.d configurations
  ansible.builtin.template:
    # src: "conf.d/{{ item | basename }}"
    src: "{{ item }}"
    dest: "/etc/angie/conf.d/{{ item | basename }}"
    owner: angie
    group: angie
    mode: "0644"
  with_fileglob: "../templates/conf.d/*"
  notify:
    - Test Angie configuration
    - Reload Angie


- name: Deploy templated Angie stream.d configurations
  ansible.builtin.template:
    src: "{{ item }}"
    dest: "/etc/angie/stream.d/{{ item | basename }}"
    owner: angie
    group: angie
    mode: "0644"
  with_fileglob: "../templates/stream.d/*"
  notify:
    - Test Angie configuration
    - Reload Angie
