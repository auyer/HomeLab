	}
	location /share/popper.js {
		if ($request_method = OPTIONS) {
			add_header Access-Control-Allow-Origin '*' always;
			add_header Access-Control-Allow-Methods 'PUT, GET, OPTIONS, DELETE, HEAD';
			add_header Access-Control-Allow-Headers 'Authorization, Content-Type';
			add_header Access-Control-Max-Age 86400;
			add_header Content-Length 0;
			add_header Content-Type text/plain;
			return 204;
		}
		proxy_pass https://{{ prosody_backend }}:5281;
		proxy_set_header Host "{{ xmpp_domain }}";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
		tcp_nodelay on;
	}
	location /share/sizzle {
		if ($request_method = OPTIONS) {
			add_header Access-Control-Allow-Origin '*' always;
			add_header Access-Control-Allow-Methods 'PUT, GET, OPTIONS, DELETE, HEAD';
			add_header Access-Control-Allow-Headers 'Authorization, Content-Type';
			add_header Access-Control-Max-Age 86400;
			add_header Content-Length 0;
			add_header Content-Type text/plain;
			return 204;
		}
		proxy_pass https://{{ prosody_backend }}:5281;
		proxy_set_header Host "{{ xmpp_domain }}";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
		tcp_nodelay on;
	}
	location /assets {
		if ($request_method = OPTIONS) {
			add_header Access-Control-Allow-Origin '*' always;
			add_header Access-Control-Allow-Methods 'PUT, GET, OPTIONS, DELETE, HEAD';
			add_header Access-Control-Allow-Headers 'Authorization, Content-Type';
			add_header Access-Control-Max-Age 86400;
			add_header Content-Length 0;
			add_header Content-Type text/plain;
			return 204;
		}
		proxy_pass https://{{ prosody_backend }}:5281;
		proxy_set_header Host "{{ xmpp_domain }}";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
		tcp_nodelay on;
	}
		

	location /share {
		if ($request_method = OPTIONS) {
			add_header Access-Control-Allow-Origin '*' always;
			add_header Access-Control-Allow-Methods 'PUT, GET, OPTIONS, DELETE, HEAD';
			add_header Access-Control-Allow-Headers 'Authorization, Content-Type';
			add_header Access-Control-Max-Age 86400;
			add_header Content-Length 0;
			add_header Content-Type text/plain;
			return 204;
		}

		proxy_pass https://{{ prosody_backend }}:5281;
		proxy_set_header Host "share.{{ xmpp_domain }}";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
		tcp_nodelay on;
		proxy_request_buffering on;
		proxy_ssl_verify off;

		client_max_body_size 21m;
		proxy_read_timeout 900s;
		proxy_send_timeout 900s;
		client_body_timeout 300s;

		add_header Access-Control-Allow-Origin '*' always;
		add_header Access-Control-Allow-Methods 'PUT, GET, OPTIONS, DELETE, HEAD' always;
		add_header Access-Control-Allow-Headers 'Authorization, Content-Type' always;
	}
}
