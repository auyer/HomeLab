user angie angie;
worker_processes auto;
worker_cpu_affinity auto;
pid /run/angie.pid;
error_log /var/log/angie/error.log notice;
include /etc/angie/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

http {

	##
	# Basic Settings
	##

	resolver {{ angie_resolver_dns | default('10.255.0.100 10.255.0.101') }} valid=300s;

	sendfile on;
	tcp_nopush on;
	types_hash_max_size 2048;
	server_tokens off; # Recommended practice is to turn this off

	# server_names_hash_bucket_size 64;
	# server_name_in_redirect off;

	include /etc/angie/mime.types;
	default_type application/octet-stream;

	##
	# SSL Settings
	##

	ssl_protocols TLSv1.2 TLSv1.3; # Dropping SSLv3 (POODLE), TLS 1.0, 1.1
	ssl_prefer_server_ciphers off; # Don't force server cipher order.

{% if acme_enabled | default(true) %}
	##
	# ACME Settings — Automatic certificate management via Let's Encrypt
	# Uses DNS-01 challenge with Cloudflare API hook
	##

	acme_client_path {{ acme_client_path | default('/var/lib/angie/acme') }};

	acme_client {{ acme_client_name | default('letsencrypt') }} https://acme-v02.api.letsencrypt.org/directory
{% if acme_email %}
		email={{ acme_email }}
{% endif %}
		key_type=ecdsa
		challenge=dns;
{% endif %}

	##
	# Logging Settings
	##

	access_log /var/log/angie/access.log;

	##
	# Gzip Settings
	##

	gzip on;

	# gzip_vary on;
	# gzip_proxied any;
	# gzip_comp_level 6;
	# gzip_buffers 16 8k;
	# gzip_http_version 1.1;
	# gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

	##
	# Virtual Host Configs
	##

	include /etc/angie/conf.d/*.conf;
	# include /etc/angie/sites-enabled/*;
}

stream {
	include /etc/angie/stream.d/*.conf;
}

