server {
        listen 80;
        listen 443 ssl;
        server_name pihole.rcpassos.me pihole.rcpassos.lan;

				ssl_certificate "/etc/letsencrypt/live/chat.rcpassos.me/fullchain.pem";
				ssl_certificate_key "/etc/letsencrypt/live/chat.rcpassos.me/privkey.pem"; 
        ssl_protocols TLSv1.2 TLSv1.3;

        # Rewrite / to /admin
        location = / {
            rewrite ^ /admin break;
            proxy_pass http://localhost:8080;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://localhost:8080;
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
