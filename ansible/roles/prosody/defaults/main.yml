---
# Prosody server variables
prosody_service_name: "Chat RCPASSOS"
prosody_invite_registration: true
prosody_admins:
  - "admin@example.com"

abuse_addresses:
  - "xmpp:abuse@example.com"
  - "mailto:abuse@example.com"

admin_addresses:
  - "xmpp:admin@example.com"
  - "mailto:admin@example.com"

prosody_configs:
  example.cfg.lua:
    chat_hostname: "chat.example.com"
    base_hostname: "example.com"
    unified_push_secret: ""

prosody_feeds: [] # name : "url"

# Default variables for the prosody role (user-overridable)
prosody_community_modules:
  - mod_cloud_notify
  - mod_cloud_notify_extensions
  - mkd_unified_push
  - mod_csi_simple
  - mod_pubsub_serverinfo
  - mod_pubsub_feeds
  - mod_pubsub_text_interface
  - mod_privilege
  - mod_throttle_presence
  - mod_measure_active_users

prosody_additional_debian_packages:
  - prosody
  - sqlite3
  - lua-unbound
  - lua-bitop
  - luarocks

# --- Bundled angie (stream front for this prosody host) ---
# Public XMPP domain. A single TLS port (443) is exposed to the web: angie's
# stream layer inspects ALPN (ssl_preread, XEP-0368) and forwards Direct TLS
# for xmpp-client / xmpp-server to Prosody. Everything else is dropped.
xmpp_domain: "chat.example.com"

# Host angie forwards Direct TLS to. Keep 127.0.0.1 when angie and prosody are
# co-located, otherwise the private address of the prosody host.
prosody_backend: "10.255.2.27"

# Prosody Direct TLS listener ports (XEP-0368). Tuned to the values used in
# templates/angie/stream.d/prosody.conf.
prosody_c2s_direct_tls_port: 5223
prosody_s2s_direct_tls_port: 5270

# coturn (STUN/TURN) backend that angie fronts on 3478/3478-udp/5349.
coturn_backend: "10.255.2.28"

# Gated debug logging (stream mux routing)
angie_debug_logging: false
angie_debug_log_level: info

# --- Let's Encrypt via certbot + Cloudflare DNS-01 ---
# Prosody terminates TLS directly, so certificates are issued by certbot and
# imported with 'prosodyctl cert import' (deploy hook under
# /etc/letsencrypt/renewal-hooks/deploy/). angie only reads a private copy of
# the certificate for the coturn (5349) stream listener.
certbot_email: ""        # Required: Let's Encrypt registration email
cloudflare_api_token: "" # Required: Cloudflare API token with DNS:Edit permission
# Domains/SANs in the issued certificate. Include the XMPP virtual host and
# every component subdomain (muc, pubsub, ...) that should present a valid cert.
certbot_domains:
  - "{{ xmpp_domain }}"
# Stable certbot lineage name: determines /etc/letsencrypt/live/<name> and the
# angie TLS copy filename. Defaults to the public XMPP domain.
certbot_cert_name: "{{ xmpp_domain }}"
# Set to true to force re-issuance even when a certificate already exists.
certbot_force_reissue: false
prosody_external_turn: false

# Angie apt repository release selection. Leave empty to auto-detect from
# facts; override when the target runs a release Angie does not ship yet
# (e.g. Debian forky -> use "13" / "trixie").
angie_repo_version_id: ""
angie_repo_codename: ""
