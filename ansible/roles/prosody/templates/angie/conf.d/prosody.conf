{% if xmpp_domain %}
server {
        listen 80;
        listen [::]:80;
{% if xmpp_mux_443 | default(false) %}
        # Port 443 is owned by the stream layer (ALPN multiplexing, see
        # stream.d/prosody.conf). HTTPS traffic arrives here via PROXY protocol.
        listen 127.0.0.1:8443 ssl proxy_protocol;
        set_real_ip_from 127.0.0.1;
        real_ip_header proxy_protocol;
{% else %}
        listen 443 ssl;
        listen [::]:443 ssl;
{% endif %}
        server_name {{ xmpp_domain }} www.{{ xmpp_domain }} g.{{ xmpp_domain }} share.{{ xmpp_domain }} pb.{{ xmpp_domain }} pubsub.{{ xmpp_domain }};

	server_tokens off;

{% if angie_debug_logging | default(false) %}
	access_log /var/log/angie/prosody-https.log prosody_debug;
	error_log /var/log/angie/prosody-https-error.log {{ angie_debug_log_level | default('info') }};
{% endif %}

{% if acme_enabled | default(true) %}
	acme {{ acme_client_name | default('letsencrypt') }};

	ssl_certificate $acme_cert_{{ acme_client_name | default('letsencrypt') }};
	ssl_certificate_key $acme_cert_key_{{ acme_client_name | default('letsencrypt') }};
{% else %}
	ssl_certificate "/etc/letsencrypt/live/{{ xmpp_domain }}/fullchain.pem";
	ssl_certificate_key "/etc/letsencrypt/live/{{ xmpp_domain }}/privkey.pem";
{% endif %}
        ssl_protocols TLSv1.2 TLSv1.3;

	ssl_verify_client off;

	resolver {{ angie_resolver_dns | default('10.255.0.100 10.255.0.101') }};

{% if acme_enabled | default(true) %}
	location @acme_hook_{{ acme_client_name | default('letsencrypt') }} {
		acme_hook {{ acme_client_name | default('letsencrypt') }};
		fastcgi_pass unix:/run/fcgiwrap.socket;
		include /etc/angie/fastcgi_params;
		fastcgi_param SCRIPT_FILENAME /usr/local/bin/angie-acme-cloudflare;
		fastcgi_param ACME_CLIENT $acme_hook_client;
		fastcgi_param ACME_HOOK $acme_hook_name;
		fastcgi_param ACME_CHALLENGE $acme_hook_challenge;
		fastcgi_param ACME_DOMAIN $acme_hook_domain;
		fastcgi_param ACME_TOKEN $acme_hook_token;
		fastcgi_param ACME_KEYAUTH $acme_hook_keyauth;
	}
{% endif %}

	location /xmpp-websocket {
	    proxy_pass https://{{ prosody_backend | default('10.255.2.27') }}:5281/xmpp-websocket;
	    proxy_http_version 1.1;
	    proxy_set_header Connection "Upgrade";
	    proxy_set_header Upgrade $http_upgrade;

	    proxy_set_header Host $host;
	    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	    proxy_set_header X-Forwarded-Proto $scheme;
	    proxy_read_timeout 900s;
	}

	location /.well-known/host-meta {
	    default_type 'application/xrd+xml';
	    add_header Access-Control-Allow-Origin '*' always;
	    alias /etc/angie/conf.d/host-meta;
	}

	location /.well-known/host-meta.json {
	    default_type 'application/jrd+json';
	    add_header Access-Control-Allow-Origin '*' always;
	    alias /etc/angie/conf.d/host-meta.json;
	}


{% if xmpp_root_redirect | default('') %}
	# Prosody serves nothing at the root path (its modules live at
	# /http-bind, /xmpp-websocket, /conversejs, /invite, ...), so send
	# browsers somewhere useful instead of prosody's 404.
	location = / {
		return 302 https://$host{{ xmpp_root_redirect }};
	}

{% endif %}
	location / {
		proxy_pass https://{{ prosody_backend }}:5281;

		proxy_set_header Host "{{ xmpp_domain }}";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
		tcp_nodelay on;
		}

		# TODO: serve files from dir
		# mod_http_libjs serves JS/CSS from /usr/share/javascript/ under /share/
		# Must be proxied to main virtual host (not share.{{ xmpp_domain }} component)
	location /share/bootstrap4 {
		if ($request_method = OPTIONS) {
			add_header Access-Control-Allow-Origin '*' always;
			add_header Access-Control-Allow-Methods 'PUT, GET, OPTIONS, DELETE, HEAD';
			add_header Access-Control-Allow-Headers 'Authorization, Content-Type';
			add_header Access-Control-Max-Age 86400;
			add_header Content-Length 0;
			add_header Content-Type text/plain;
			return 204;
		}
		proxy_pass https://{{ prosody_backend }}:5281;
		proxy_set_header Host "{{ xmpp_domain }}";
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_buffering off;
		tcp_nodelay on;
	}
