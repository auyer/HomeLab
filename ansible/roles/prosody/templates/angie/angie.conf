user angie angie;
worker_processes auto;
worker_cpu_affinity auto;
pid /run/angie.pid;
error_log /var/log/angie/error.log notice;
include /etc/angie/modules-enabled/*.conf;

events {
	worker_connections 768;
	# multi_accept on;
}

# No http{} block: this angie only multiplexes XMPP Direct TLS (XEP-0368) by
# ALPN at the stream layer. HTTPS/web (conversejs & co) is intentionally not
# served anymore.

stream {
{% if angie_debug_logging | default(false) %}
	log_format stream_mux '$remote_addr [$time_local] status=$status '
	                      'sni="$ssl_preread_server_name" alpn="$ssl_preread_alpn_protocols" '
	                      'up=$upstream_addr in=$bytes_received out=$bytes_sent t=$session_time';
	error_log /var/log/angie/stream-error.log {{ angie_debug_log_level | default('info') }};
{% endif %}
	include /etc/angie/stream.d/*.conf;
}
