# start prosody
# Single public TLS port (443). TLS is not terminated here; ssl_preread only
# looks at the ClientHello ALPN extension to route XEP-0368 Direct TLS:
#   xmpp-client -> prosody c2s Direct TLS (c2s_direct_tls_ports)
#   xmpp-server -> prosody s2s Direct TLS (s2s_direct_tls_ports)
# Any other TLS traffic (http/1.1, h2, or no ALPN) is dropped - HTTPS /
# conversejs is no longer served.

map $ssl_preread_alpn_protocols $xmpp_upstream {
	~\bxmpp-client\b	xmpp_c2s;
	~\bxmpp-server\b	xmpp_s2s;
	default			drop;
}

upstream xmpp_c2s {
	server {{ prosody_backend | default('10.255.2.27') }}:{{ prosody_c2s_direct_tls_port | default(5223) }};
}

upstream xmpp_s2s {
	server {{ prosody_backend | default('10.255.2.27') }}:{{ prosody_s2s_direct_tls_port | default(5270) }};
}

# Nothing listens on loopback:1, so unroutable (non-XMPP) connections are
# refused instead of being proxied anywhere.
upstream drop {
	server 127.0.0.1:1;
}

server {
	listen 443;
	listen [::]:443;
	ssl_preread on;
	proxy_pass $xmpp_upstream;
{% if angie_debug_logging | default(false) %}
	access_log /var/log/angie/stream-mux.log stream_mux;
{% endif %}
}
# end prosody
