{% if xmpp_mux_443 | default(false) %}
# start prosody
# Public port 443 multiplexing:
#  - TLS connections with XEP-0368 ALPN (xmpp-client / xmpp-server) are passed
#    through untouched to prosody's Direct TLS port (mod_net_multiplex),
#    so prosody terminates TLS and can verify s2s client certificates.
#  - Everything else (HTTPS: BOSH, websocket, file share, host-meta) goes to
#    the local angie http layer (127.0.0.1:8443) with PROXY protocol carrying
#    the real client address.

map $ssl_preread_alpn_protocols $prosody_mux_upstream {
	~\bxmpp-server\b	xmpp_pp_strip;
	~\bxmpp-client\b	xmpp_pp_strip;
	default			angie_https;
}

upstream xmpp_pp_strip {
	server 127.0.0.1:8445;
}

upstream angie_https {
	server 127.0.0.1:8443;
}

upstream prosody_direct_tls {
	server {{ prosody_backend | default('10.255.2.27') }}:5223;
}

# Direct/LAN entry.
server {
	listen 443;
	ssl_preread on;
	proxy_pass $prosody_mux_upstream;
	proxy_protocol on;
{% if angie_debug_logging | default(false) %}
	access_log /var/log/angie/stream-mux.log stream_mux;
{% endif %}
}

{% if xmpp_outpost_pp_sources | default([]) | length == 0 %}
# NOTE: xmpp_outpost_pp_sources is empty - PROXY protocol client addresses
# are parsed but not trusted, so $remote_addr stays the relay's IP.
{% endif %}
# Outpost entry: Traefik TCP passthrough dials this port with PROXY protocol
# v2 carrying the real client address. set_real_ip_from rewrites $remote_addr
# from the PROXY header, so the outgoing PROXY protocol (added below) also
# carries the original client.
server {
	listen {{ xmpp_outpost_pp_port | default(8843) }} proxy_protocol;
	ssl_preread on;
{% for src in xmpp_outpost_pp_sources | default([]) %}
	set_real_ip_from {{ src }};
{% endfor %}
	proxy_pass $prosody_mux_upstream;
	proxy_protocol on;
{% if angie_debug_logging | default(false) %}
	access_log /var/log/angie/stream-mux.log stream_mux;
{% endif %}
}

# Strips the PROXY protocol header before handing raw Direct TLS to prosody
# (prosody does not speak PROXY protocol).
server {
	listen 127.0.0.1:8445 proxy_protocol;
	proxy_pass prosody_direct_tls;
{% if angie_debug_logging | default(false) %}
	access_log /var/log/angie/stream-mux.log stream_mux;
{% endif %}
}
# end prosody
{% endif %}
