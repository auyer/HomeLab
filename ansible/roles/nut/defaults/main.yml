---
# Default variables for the nut role (user-overridable)
#
# Deploys a NUT "netserver": driver + upsd (data server) + upsmon (monitor)
# on a Debian/Raspbian host with a locally attached UPS.

# --- packages ---------------------------------------------------------------
# The `nut` metapackage pulls in `nut-server` (upsd + drivers) and
# `nut-client` (upsmon + upsc/upscmd/upssched).
nut_packages:
  - nut

# --- nut.conf ---------------------------------------------------------------
# MODE gates every unit via an ExecCondition in the packaged systemd units:
# nut-server, nut-monitor and nut-driver-enumerator do not start at all when
# MODE is "none" (or "netclient" for the server/driver side). A wrong value
# fails silently, hence the assertion in tasks/main.yml.
nut_mode: netserver # none | standalone | netserver | netclient
nut_upsd_options: ""
nut_upsmon_options: ""

# --- ups.conf ---------------------------------------------------------------
nut_ups_name: ups
# blazer_ser is deprecated upstream but is what this UPS is known to work
# with. nutdrv_qx is the modern replacement for the Megatec/Q* protocol family.
nut_ups_driver: blazer_ser
nut_ups_port: /dev/ttyACM0
nut_ups_desc: "tsshara"
nut_ups_maxretry: 3

# --- serial device access ---------------------------------------------------
# Debian deliberately does NOT add the nut user to dialout (see
# /usr/share/doc/nut/README.Debian, section 3, and the commented-out
# `adduser nut dialout` line in nut-server.postinst). Without this the driver
# cannot open the UPS port.
nut_device_group: dialout

# --- upsd.conf --------------------------------------------------------------
# Deliberately wide: upsd.users credentials travel unencrypted (see
# README.Debian SECURITY CONSIDERATIONS). Narrow this to a LAN address/CIDR
# if the UPS data should not be reachable from the whole network.
nut_upsd_listen_address: "0.0.0.0"
nut_upsd_listen_port: 3493
nut_upsd_maxage: 15

# --- upsd.users -------------------------------------------------------------
# Passwords have no usable default on purpose: the role asserts they are set.
nut_admin_user: admin
nut_admin_password: ""
nut_observer_user: observer
nut_observer_password: ""

# --- upsmon.conf ------------------------------------------------------------
nut_monitor_ups: "{{ nut_ups_name }}@localhost"
nut_monitor_powervalue: 1
nut_monitor_user: "{{ nut_admin_user }}"
nut_monitor_password: "{{ nut_admin_password }}"
nut_monitor_role: primary # primary | secondary
nut_minsupplies: 1
nut_shutdowncmd: "/sbin/shutdown -h +0"
nut_powerdownflag: "/etc/killpower"
nut_pollfreq: 5
nut_pollfreqalert: 5
nut_deadtime: 15
nut_hostsync: 15
nut_finaldelay: 180
nut_offduration: 30
nut_rbwarntime: 43200
nut_nocommwarntime: 300

# --- upssched -----------------------------------------------------------------
# Off by default: deploying it requires NOTIFYFLAG ...+EXEC wiring in
# upsmon.conf and a writable FIFO directory under /run, which is more moving
# parts than a plain monitor needs. When disabled, upssched.conf is deployed
# with PIPEFN/LOCKFN/AT commented out, matching the stock Debian sample.
nut_upssched_enabled: false
nut_upssched_dir: /run/nut/upssched
# Packaged by nut-client; the role does not manage this script itself.
# Point it at your own file if you need different behaviour.
nut_upssched_cmdscript: /usr/bin/upssched-cmd
nut_upssched_pipefn: "{{ nut_upssched_dir }}/upssched.pipe"
nut_upssched_lockfn: "{{ nut_upssched_dir }}/upssched.lock"
# AT <notifytype> * <action> <name> [<interval>]
nut_upssched_timers:
  - notifytype: ONBATT
    action: START-TIMER
    name: onbattwarn
    interval: 60
  - notifytype: ONLINE
    action: CANCEL-TIMER
    name: onbattwarn
  - notifytype: COMMBAD
    action: START-TIMER
    name: upsgone
    interval: 30
  - notifytype: COMMOK
    action: CANCEL-TIMER
    name: upsgone

# --- sounds ----------------------------------------------------------------
# Audible alerts for UPS events, played on the host itself.
#
# Two separate mechanisms are involved because NUT cannot do this with one:
#
#   * Discrete events (ONBATT/LOWBATT/ONLINE/COMMBAD/COMMOK) are real upsmon
#     notifications. They reach a script via NOTIFYCMD, which upsmon only
#     calls for NOTIFYFLAG entries carrying +EXEC.
#
#   * Battery percentages are NOT notifications. NUT never fires "battery
#     reached 60%"; battery.charge is just a value you have to poll. Those
#     sounds therefore come from nut-sound-battery.service (a systemd timer
#     running nut-sound-battery every nut_sound_battery_interval seconds and
#     playing a file when a threshold is crossed going down).
#
# upsmon allows exactly one NOTIFYCMD, so when both upssched and sounds are in
# use NOTIFYCMD points at /usr/local/bin/nut-notify, which fans out to both.
nut_sounds_enabled: false
nut_sounds_dir: /opt/sounds
# aplay (alsa-utils) | paplay/pw-play (PulseAudio/PipeWire) | mplayer | ...
# Must run as the nut user and be able to open an output device on this host.
nut_sounds_player: aplay
nut_sounds_player_args: "-q"
# Notifications are best-effort: a missing/broken audio device must never
# break shutdown handling, so playback is fire-and-forget and failures are
# logged rather than raised.
nut_sounds_files:
  ONBATT: lost_power.wav
  LOWBATT: low_power.wav
  ONLINE: online.wav
  COMMBAD: ""
  COMMOK: ""
  # Falling battery thresholds -> file. Checked top-down, so the first match
  # wins; a percentage that keeps dropping through 60 then 40 then 20 plays
  # each sound once as it crosses.
nut_sound_battery_thresholds:
  - { percent: 60, file: batery_60.wav }
  - { percent: 40, file: batery_40.wav }
  - { percent: 20, file: batery_20.wav }
# Re-arm threshold: a sound replays only after the battery has climbed this
# many points back above the level that triggered it. Without hysteresis a
# battery hovering at exactly 60% would replay the same file on every poll.
nut_sound_battery_hysteresis: 5
# Only alert while discharging; charging from 10% back to 60% is not news.
nut_sound_battery_only_on_battery: true
# Guard against a stuck audio device queueing dozens of overlapping players.
nut_sound_max_players: 3
# Environment for the player inside nut-sound-battery.service. aplay needs a
# usable default PCM; on PulseAudio/PipeWire hosts you may need to point it at
# a server socket, e.g.
#   nut_sounds_player_env:
#     XDG_RUNTIME_DIR: "/run/user/1000"
# Empty by default (plain ALSA via /dev/snd).
nut_sounds_player_env: {}
nut_sound_battery_interval: "1min"
# Groups that let the nut user reach the sound device. This is not optional in
# practice: upsmon runs NOTIFYCMD as RUN_AS_USER (default nut) and the sound
# units run as nut too, so without these groups aplay fails with "Permission
# denied" and the alert is silent exactly when it matters.
#
# 'auto' detects the audio stack on the target and grants what is needed:
#   * 'audio' whenever /dev/snd exists (Debian: /dev/snd/* is 0660 root:audio)
#   * 'pulse-access' when PulseAudio or PipeWire is running, since the server
#     socket is not world-accessible
# Set an explicit list to override, e.g. [audio] or [audio, pulse-access].
nut_sounds_extra_groups: auto
# Seconds to keep retrying when the audio device is not yet usable. A PipeWire
# or PulseAudio server can still be starting right after boot, and losing the
# first alert after a reboot is the worst possible time to lose it.
nut_sounds_device_wait: 5
# Play one real file as the nut user during provisioning so a permissions or
# device problem fails the playbook instead of surfacing at 2am when the power
# actually dies. Set false only if the target legitimately has no audio device
# (a headless host with nowhere to make noise).
nut_sounds_verify_audio: true
# Which configured file to use for that probe.
nut_audio_probe_file: "{{ nut_sounds_files['ONBATT'] }}"
nut_sound_battery_unit: nut-sound-battery.service
nut_sound_battery_timer_unit: nut-sound-battery.timer

# --- heartbeat (Uptime Kuma push) -------------------------------------------
# On every poller tick, push the UPS power state to an Uptime Kuma push monitor.
# The monitor therefore reflects MAINS POWER, not process liveness:
#   * on line power (ups.status contains OL) -> status=up
#   * on battery    (ups.status contains OB) -> status=down
# A dead host, a broken driver or a stopped timer produce no push at all, which
# Kuma reports as a missed heartbeat, so liveness comes for free.
#
# The URL embeds a push token and is therefore a secret: set nut_heartbeat_url
# in group_vars for the host (see group_vars/pi3.yml), never here.
nut_heartbeat_enabled: false
nut_heartbeat_url: ""
# Timeout for the push. It must be short: this runs on a timer and a hung
# request would pile up runs.
nut_heartbeat_timeout: 10
# What the monitor's "ping" column carries.
#   latency -> leave ping empty so Kuma records the real HTTP round-trip time
#   charge  -> send the battery percentage, turning the monitor into a gauge
nut_heartbeat_ping_mode: latency
# Message sent while on line power. Keep it short: it is shown per heartbeat.
nut_heartbeat_msg_up: "OK"
# Message sent while on battery; {charge} and {status} are substituted.
nut_heartbeat_msg_down: "on battery {charge}%"

# --- services ---------------------------------------------------------------
# nut-driver is a *target* (nut-driver.target), not a service, and the
# per-device instances are created/removed by nut-driver-enumerator.service
# from ups.conf. nut.target is the umbrella that Wants= all of them.
nut_target_unit: nut.target
nut_driver_enumerator_unit: nut-driver-enumerator.service
nut_server_unit: nut-server.service
nut_monitor_unit: nut-monitor.service
nut_notify_cmd: /usr/local/bin/nut-notify
# upssched is a separate program that upsmon would normally call directly.
# When it is enabled, nut-notify calls it on our behalf.
nut_upssched_bin: /usr/sbin/upssched
# Where the battery poller keeps its per-threshold state. StateDirectory=nut-sound
# in the unit makes systemd create and own /var/lib/nut-sound for us.
nut_sound_state_file: /var/lib/nut-sound/battery-thresholds.state
