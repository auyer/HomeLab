---
# Coturn role tasks — install, configure

- name: Ensure Coturn is installed
  ansible.builtin.apt:
    name: coturn
    state: present
    update_cache: true

- name: Ensure Coturn daemon is enabled
  ansible.builtin.lineinfile:
    path: /etc/default/coturn
    regexp: "^#?TURNSERVER_ENABLED="
    line: "TURNSERVER_ENABLED=1"
    state: present
  notify:
    - Restart Coturn

- name: Deploy Coturn configuration
  ansible.builtin.template:
    src: turnserver.conf.j2
    dest: /etc/turnserver.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Restart Coturn
