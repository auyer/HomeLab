---
- name: Upgrade K3s Servers
  hosts: server
  become: true
  serial: 1
  environment:
    PATH: "/usr/local/bin:{{ ansible_env.PATH }}"
  roles:
    - role: k3s_upgrade

- name: Upgrade K3s Agents
  hosts: agent
  become: true
  environment:
    PATH: "/usr/local/bin:{{ ansible_env.PATH }}"
  roles:
    - role: k3s_upgrade
