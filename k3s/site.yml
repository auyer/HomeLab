---
- name: Install extra OS packages
  hosts: k3s_cluster
  become: true
  tasks:
    - name: Install extra packages
      ansible.builtin.package:
        name: "{{ extra_packages }}"
        state: present
      when: extra_packages | default([]) | length > 0

- name: Import k3s cluster playbook
  ansible.builtin.import_playbook: k3s-ansible/playbooks/site.yml
